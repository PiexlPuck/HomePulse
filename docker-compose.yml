services:
  homepulse-db:
    image: postgres:15-alpine
    container_name: homepulse-db
    environment:
      POSTGRES_DB: homepulse
      POSTGRES_USER: hp_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hp_admin -d homepulse"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  homepulse-app:
    build: .
    container_name: homepulse-app
    depends_on:
      homepulse-db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://hp_admin:${DB_PASSWORD}@127.0.0.1:5432/homepulse
      - SECRET_KEY=${JWT_SECRET_KEY}
    volumes:
      - ./plugins:/app/plugins
      - ./db_backups:/app/db_backups
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    restart: always
    network_mode: "host"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
